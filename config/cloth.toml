# Cloth settings for the jeans-folding task.
#
# Pick a garment when starting the server:   start.bat --garment shorts
# Use another file:                          start.bat --cloth-config my_cloth.toml
# Check a change without the headset:        .venv\Scripts\python scripts\cloth_bench.py --garment shorts --test all
#
# Every garment uses the jeans pattern (a front and a back panel sewn along the outer and inner leg
# seams, open at the waist and the hems); the values below set its size and its fabric. A garment
# can start from another one with `inherits = "name"` and change only a few values.
# Units: metres, kilograms, seconds, newtons. Misspelled keys are reported as errors.

default = "jeans"

[simulation]                 # shared by all garments (a garment can override: [garments.NAME.simulation])
timestep = 0.004             # physics step [s]. 0.003 = a little more accurate, ~30 % slower;
                             # 0.005 degrades a crumpled heap; 0.006 is unstable
solver_iterations = 30       # constraint solver budget per step. Below ~30 the threads stretch
                             # like rubber while a leg hangs from the grippers; more = slower

[grasp]                      # the gripper's pinch on the fabric (a garment can override: [garments.NAME.grasp])
slip_force = 30.0            # pull [N] at which fabric slips out of a closed pinch (real grippers ~20-40)
release_gap = 0.004          # the pinch lets go once the pads are this much further apart than when
                             # they closed [m]: a short flick of the stick opens it
pad_friction = 1.0           # silicone finger pads on fabric (0.6 slippery .. 1.2 grippy)
model = "pinch"              # newton engine: "pinch" = the points between the pads ride with the gripper
                             # (like the other engines); "friction" = nothing is attached, the pads squeeze
                             # the fabric and friction holds it (needs the fabric to fold between the pads)

[gpu]                        # the GPU cloth engine (start.bat --cloth-engine gpu; XPBD on any Vulkan
                             # GPU). A garment can override: [garments.NAME.gpu]. The garment's size,
                             # mass and friction are shared; these replace its MuJoCo-only settings.
spacing = 0.010              # distance between simulated points [m] (~9000 for the jeans). 0.012 =
                             # faster but folded stacks are thicker; the GPU cost grows with the points
substeps = 20                # solver steps per 1/60 s frame: more = stiffer threads and safer contacts
self_collision_every = 2     # fabric-on-fabric collision on every n-th substep (1 = every one: ~40 %
                             # slower; a point moves at most 0.4 thickness per substep)
thickness = 0.95             # self-collision distance as a fraction of spacing (9.5 mm): how thick
                             # a layer is in a fold. Below ~0.9 the fabric slips through itself
                             # (0.75 -> hundreds of crossings in a fold); 1.0 = puffier, springier folds
stretch_compliance = 1e-8    # threads: stretch softness (0 = inextensible; 1e-6 visibly stretchy)
shear_compliance = 2e-5      # bias diagonals: shear softness (denim shears easily)
bend_compliance = 2e-3       # folds: bending softness (smaller = stiffer fabric, rounder folds)
cloth_friction = 0.5         # friction coefficient, fabric on fabric: keeps folds in place (denim
                             # on denim ~0.5; 0 = layers slide apart and folds fall open)
table_friction = 0.4         # ... fabric on the laminate table (0 = ice)
gripper_friction = 0.3       # ... fabric on an arm while its gripper pinches (around the pinch).
                             # An arm whose gripper holds nothing doesn't squeeze the fabric, so it
                             # has no friction: fabric slides off open fingers instead of hanging on
air_drag = 0.5               # [1/s]: dropped fabric floats down a little
relaxation = 1.5             # solver over-relaxation (1 .. 1.8; leave as is)

[newton]                     # the Newton VBD cloth engine (start.bat --cloth-engine newton; NVIDIA GPU,
                             # pip install -r requirements-newton.txt). Not real time yet: these values
                             # run at ~0.3 x real time on an RTX 4090 (docs/newton_engine.md).
                             # A garment can override: [garments.NAME.newton]. The
                             # garment's size and mass are shared; these replace its MuJoCo-only settings.
device = "cuda"              # cuda (NVIDIA GPU, real time) or cpu (Warp on the processor: slow, for tests)
spacing = 0.005              # distance between simulated points [m] (~36000 for the jeans). 0.010 = ~8900 and
                             # ~4x faster, but too coarse to drape like denim (a 30 cm disc stays flat:
                             # Cusick drape coefficient 1.0 against 0.6-0.85). edge_ke / tri_ke depend on it:
                             # re-run scripts/fabric_calibrate.py --spacing ... when changing it
substeps = 16                # solver steps per 1/60 s frame. VBD needs ~16 x 8 sweeps a frame for denim-like
                             # stretch at 10 mm (a lifted leg stretches 2.4 % at 16 x 8, 12 % at 4 x 8)
iterations = 16              # VBD iterations per substep. substeps x iterations sets the stretch and the cost:
                             # at 5 mm, 16 x 8 left the folded jeans 7.8 % stretched (p99), 16 x 16 6.3 %, ~1.6x the time
fps = 60                     # cloth frames per second of simulated time
self_contact = true          # fabric on fabric (vertex-triangle and edge-edge, every substep). false = the
                             # layers pass through each other (only for measuring the cost)
tri_ke = 2890.0              # in-plane stretch stiffness [N/m] (2D Lame mu), fitted at 5 mm, 16 x 16: plain denim
                             # stretches 1 % under 49 N/m, denim once its yarns are straight (a tester reads ~2-4 %
                             # including the crimp; fitted to 3 % the linear model let a fold stretch 16 %)
tri_ka = 2890.0              # in-plane area stiffness [N/m] (2D Lame lambda), fitted with tri_ke
tri_kd = 1.5e-5              # in-plane damping [N s/m]
edge_ke = 6.61               # bending stiffness per hinge [N m/rad], fitted at 5 mm, 16 x 16: a 25 mm strip droops
                             # 41.5 deg at 7 cm overhang (ASTM D1388 bending length 3.5 cm, rigid 12 oz denim
                             # 3-4.5 cm). A 30 cm disc then drapes to 0.92 (Cusick), a little stiffer than denim's
                             # 0.6-0.85. It depends on spacing, iterations and tri_ke: scripts/fabric_calibrate.py
edge_kd = 1.0e-3             # bending damping [N m s/rad]
fabric_density = 0.407       # one layer of the denim [kg/m^2] (12 oz per square yard), used with `structure`
structure = true             # sewn jeans: the waistband, fly, hems, seams and pockets weigh and bend like the
                             # layers sewn there (vrteleop/cloth.py GARMENT_PARTS; the jeans weigh ~0.46 kg).
                             # false = a uniform sheet of the garment's mass
particle_radius = 0.001      # contact radius of the fabric against the robot and the table [m]
self_contact_margin = 0.002  # layers of fabric rest this far apart [m] (two layers of 12 oz denim ~2 mm)
self_contact_gap = 0.001     # the self-contact search reaches this much further [m]
body_contact_gap = 0.002     # ... and the robot / table contact search this much [m]
full_surface_contact = true  # the robot and the table touch the fabric's edges and faces, not only its
                             # points (points ~8 mm apart with a 1 mm radius let a finger slip between them).
                             # Needs CUDA (signed-distance fields); also cheaper than points-only there
contact_ke = 1.0e4           # contact stiffness [N/m]
contact_kd = 1.0e-2          # contact damping [N s/m]
cloth_friction = 0.5         # friction coefficient, fabric on fabric (denim on denim ~0.5)
table_friction = 0.4         # ... fabric on the laminate table
pad_friction = 1.5           # ... fabric on the silicone finger pads (1.0 .. 2.0)
gripper_friction = 0.5       # ... fabric on the rest of the gripper and the arm
settle_frames = 30           # frames simulated when the scene resets, before the clock starts


[garments.jeans]             # a pair of adult 12 oz denim jeans, W32 L32 regular fit
# ---- size of the garment lying flat ------------------------------------------------------------
length = 1.00                # waistband to hem [m]
rise = 0.27                  # waistband to crotch [m]
waist = 0.39                 # flat width at the waistband [m]
hip = 0.45                   # flat width at the crotch line [m]
thigh = 0.225                # width of one leg at the crotch line [m] (at most hip / 2)
hem = 0.19                   # width of one leg at the hem [m] (at most hip / 2)

# ---- simulation resolution ---------------------------------------------------------------------
spacing = 0.055              # distance between simulated points [m]. Smaller = finer folds but much
                             # slower (0.045 is ~2x the CPU); larger (0.06) = faster, coarser

# ---- fabric ------------------------------------------------------------------------------------
mass = 0.65                  # whole garment [kg] (jeans 0.6-0.8, light chinos ~0.4)
friction = 0.4               # fabric on the table [-] (the pads use grasp.pad_friction)
# Stretch ("tensile" behaviour). The threads along and across the legs are near-inextensible
# constraints; these set how hard they resist stretching:
edge_solref = [0.004, 1.0]   # [time constant s, damping ratio]. Smaller time constant = stiffer
                             # threads; MuJoCo won't go below 2 x timestep, so 0.004 means "as stiff
                             # as possible". 0.02 lets denim stretch visibly (stretch denim, knits)
edge_solimp = [0.95, 0.99, 0.001, 0.5, 2]   # MuJoCo impedance of those constraints (leave as is)
shear_stiffness = 8.0        # resistance to diagonal (bias) stretching [N/m]. Woven denim shears
                             # easily (5-10); higher values make the jeans move like cardboard
# Bending: how stiffly the fabric folds. Bending stiffness = bend_young * thickness^3 / 12(1-nu^2),
# ~3e-5 N m for two layers of 12 oz denim.
bend_young = 6.0e3           # [Pa] with `thickness` below. Softer fabric 2e3, heavy canvas 1.5e4
thickness = 0.004            # fabric thickness used for bending [m] (two layers of denim)
damping = 0.004              # internal damping of stretch and bending [N s/m]
air_drag = 0.012             # drag per point [N s/m]: dropped fabric floats down (~2.5 m/s terminal)

# ---- contacts ----------------------------------------------------------------------------------
sphere_r = 0.005             # contact sphere radius at every point [m]: fabric rests 5 mm above the table
layer_gap = 0.012            # the front panel starts this far above the back panel [m] (> 2 x sphere_r)
self_condim = 1              # fabric on fabric: 1 = frictionless (layers slide), 3 = with friction
                             # (~20 % more CPU)
surface_margin = 0.006       # the cloth surface starts pushing back this far before layers touch [m]:
surface_gap = 0.003          # ... pushing only from (margin - gap) = 3 mm. Catches fast, sharp folds
                             # (e.g. a leg squeezed between the grippers) before they cut through
# Which contacts keep the layers apart (all on = fabric never passes through itself, ~40 % more CPU
# than start.bat --cloth-fast, which switches the first three off and sphere_pairs on):
both_way = true              # both panels' spheres touch the other panel's surface
own_panel = true             # spheres also touch their own panel's surface (a fold onto itself)
self_collide = true          # the surface collides with itself triangle against triangle
sphere_pairs = false         # contact spheres touch each other (redundant with the above)


[garments.shorts]            # denim shorts: the same jeans, cut above the knee
inherits = "jeans"
length = 0.55
hem = 0.22                   # wide leg opening (at most hip / 2 = 0.225)
mass = 0.40


[garments.stretch_jeans]     # skinny jeans with elastane: lighter, softer, a little stretchy
inherits = "jeans"
thigh = 0.19
hem = 0.14
mass = 0.55
edge_solref = [0.01, 1.0]    # threads give a little
shear_stiffness = 5.0
bend_young = 3.0e3
